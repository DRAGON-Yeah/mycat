services:
  mysql:
    image: mysql:8.4
    container_name: mycat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: navicat
      MYSQL_PASSWORD: navicat
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: mycat-postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: navicat
      POSTGRES_PASSWORD: navicat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navicat -d demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: mycat-redis
    command: ["redis-server", "--requirepass", "navicat", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "navicat", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
