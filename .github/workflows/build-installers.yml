name: Build installers

# 手动触发，或推送 v* 标签时触发
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Universal 包，同时支持 Intel(x86_64) 与 Apple Silicon(arm64)
          - name: macOS Universal (Intel + Apple Silicon)
            platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Windows：x64 安装包（NSIS .exe + MSI）
          - name: Windows x64
            platform: windows-latest
            args: ""
            targets: ""
          # Windows：ARM64 安装包
          - name: Windows ARM64
            platform: windows-latest
            args: --target aarch64-pc-windows-msvc
            targets: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # ssh2 使用 vendored-openssl：Windows 上需要 perl + nasm 编译 OpenSSL
      - name: Install OpenSSL build tools (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          perl -v

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
