[package]
name = "mycat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mycat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
thiserror = "2.0.21"
rusqlite = { version = "0.43.0", features = ["bundled"] }
hex = "0.4.3"
uuid = { version = "1.29.2", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
rand = "0.8"
mysql = { version = "28.0.4", features = ["native-tls"] }
postgres = "0.19.14"
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
# vendored-openssl：静态编译 OpenSSL，避免打包后依赖本机 Homebrew 的 libssl
ssh2 = { version = "0.9.7", features = ["vendored-openssl"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
encoding_rs = "0.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
